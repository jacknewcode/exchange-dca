services:
  mysql:
    image: mysql:5.7.44
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orbit_dca
      MYSQL_USER: orbit_dca
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u orbit_dca -D orbit_dca -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
      TZ: ${DEFAULT_TIMEZONE:-Asia/Shanghai}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Shanghai}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set initial AUTH_PASSWORD in .env}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: orbit_dca
      MYSQL_USER: orbit_dca
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MIN_ORDER_USDT: ${MIN_ORDER_USDT:-1}
      MAX_ORDER_USDT: ${MAX_ORDER_USDT:-500}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
  app_data:
