<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · Orbit DCA</title>
  <style>
    :root{font-family:Arial,"Microsoft YaHei",sans-serif;color:#20212a;background:#f5f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f7f7fb,#eceef6)}.login-card{width:min(420px,calc(100% - 32px));padding:34px 34px 30px;border:1px solid #e3e5ee;border-radius:18px;background:#fff;box-shadow:0 22px 60px rgba(31,34,59,.14)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}.brand-mark{display:flex;align-items:flex-end;gap:3px;height:28px}.brand-mark i{display:block;width:6px;border-radius:4px;background:#7769ee}.brand-mark i:nth-child(1){height:14px}.brand-mark i:nth-child(2){height:22px;background:#55c8ce}.brand-mark i:nth-child(3){height:28px}.brand strong{display:block;font-size:19px;letter-spacing:.15em}.brand small{display:block;margin-top:4px;color:#9294a5;font-size:9px;letter-spacing:.13em}.eyebrow{margin:0 0 9px;color:#8b8da0;font:10px monospace;letter-spacing:.15em}.login-card h1{margin:0 0 9px;font-size:26px;letter-spacing:-.04em}.subtitle{margin:0 0 26px;color:#858798;font-size:12px}.field{display:block;margin:0 0 16px;color:#666876;font-size:11px;font-weight:600}.field input{display:block;width:100%;height:44px;margin-top:7px;padding:0 13px;border:1px solid #dfe1ea;border-radius:8px;outline:0;color:#252632;font-size:13px}.field input:focus{border-color:#7769ee;box-shadow:0 0 0 3px #eeecff}.login-button{width:100%;height:44px;border:0;border-radius:8px;background:#7366ed;color:#fff;font-weight:700;cursor:pointer;box-shadow:0 9px 18px rgba(115,102,237,.25)}.login-button:disabled{opacity:.65;cursor:wait}.error{min-height:18px;margin:4px 0 14px;color:#c34a59;font-size:11px}.security{margin:22px 0 0;padding:12px;border-radius:8px;background:#f7f7fb;color:#9294a3;font-size:10px;line-height:1.6}
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><div><strong>控制台</strong></div></div>
    <p class="eyebrow">SECURE ACCESS</p>
    <h1>登录访问控制台</h1>
    <p class="subtitle">请输入账户信息继续管理你的 Bitget 定投计划。</p>
    <form id="login-form">
      <label class="field">用户名<input name="username" autocomplete="username" required autofocus /></label>
      <label class="field">密码<input name="password" type="password" autocomplete="current-password" required /></label>
      <div class="error" id="login-error" role="alert"></div>
      <button class="login-button" type="submit">登录</button>
    </form>
    <div class="security">连接已启用身份验证。请不要在公共设备上保存密码。</div>
  </main>
  <script>
    const form = document.querySelector('#login-form');
    const error = document.querySelector('#login-error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      error.textContent = '';
      const data = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data) });
        const payload = await response.json();
        if (!response.ok || payload.ok === false) throw new Error(payload.error || '登录失败');
        location.href = '/';
      } catch (loginError) {
        error.textContent = loginError.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
